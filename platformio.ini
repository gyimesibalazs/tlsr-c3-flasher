; ESP32-C3 as a Telink TLSR825x SWire (SWS) flasher.
;   c3-usb  : boards whose USB connector goes straight to the C3 (Super Mini, XIAO, DevKitM USB port)
;   c3-uart : boards with a separate USB-UART chip (CH340 / CP2102) on UART0

[platformio]
default_envs = c3-usb

[env]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 460800

[env:c3-usb]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3-uart]
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
