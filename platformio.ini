; ESP32-C3 as a Telink TLSR825x SWire (SWS) flasher.
;   c3-usb: boards whose USB connector goes straight to the C3 (Super Mini, XIAO, DevKitM USB port).
;   Boards with a separate USB-UART chip are not supported: UART0 (GPIO 20 / 21) is used for the target.

[platformio]
default_envs = c3-usb

[env]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 460800

[env:c3-usb]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
